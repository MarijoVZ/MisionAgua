<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Misión Agua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: cápsula móvil de 430px máx. y 100dvh — barra superior, vista con scroll, barra de navegación inferior; los diálogos suben como hojas inferiores */
:root {
  color-scheme: light;
  --desk: #D5DEE6;
  --sky: #E9F6FF;
  --sky-2: #D3EEFF;
  --ink: #0B3B66;
  --ink-soft: #46698B;
  --card: #FFFFFF;
  --line: #D3E7F4;
  --aqua: #0F8FB0;
  --sun: #FFC23C;
  --coral: #E5484D;
  --leaf: #1E9B53;
  --ok-bg: #DDF7E7;
  --bad-bg: #FFE4E3;
  --scrim: rgba(7, 32, 56, .45);
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Andika', 'Verdana', system-ui, sans-serif;
  --nav-h: 68px;
  --c: #0F8FB0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink); font-family: var(--body); font-size: 17px;
  display: flex; justify-content: center; overflow: hidden;
  background-image: radial-gradient(circle at 1px 1px, rgba(11,59,102,.08) 1px, transparent 0); background-size: 22px 22px;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---- cápsula ---- */
.phone {
  position: relative; width: 100%; max-width: 430px;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  background: var(--sky); overflow: hidden; display: flex; flex-direction: column;
  isolation: isolate;
}
@media (min-width: 460px) { .phone { box-shadow: 0 0 0 1px rgba(11,59,102,.08), 0 20px 60px rgba(11,59,102,.18); } }

/* ---- barra superior ---- */
.appbar { flex: none; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 16px; background: var(--sky); position: relative; z-index: 2; }
.appbar h1 { flex: 1; margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.appbar h1 svg { width: 26px; height: 32px; flex: none; }
.chip-stars { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 18px; }
.chip-stars svg { width: 20px; height: 20px; }

.ibtn { position: relative; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .12s, background-color .12s; }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { transform: scale(.92); background: rgba(11,59,102,.08); }

/* ---- vistas ---- */
.views { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; transition: opacity .2s ease, transform .2s ease; }
.view[aria-hidden="true"] { opacity: 0; transform: translateY(8px); pointer-events: none; visibility: hidden; }

/* ---- barra de navegación inferior ---- */
.bnav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px; height: var(--nav-h); position: relative; z-index: 2; }
.tab { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: 16px; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; }
.tab .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background-color .2s, width .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .pill { background: var(--sky-2); }
.tab:active .pill { transform: scale(.92); }

/* ---- efecto ripple ---- */
.rp { position: relative; overflow: hidden; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .18; transform: scale(0); animation: ripple .5s ease-out forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---- inicio ---- */
.hello { background: var(--ink); color: #fff; border-radius: 24px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.hello svg { width: 44px; height: 56px; flex: none; }
.hello b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.hello p { margin: 4px 0 0; color: #CFE8FF; font-size: 15px; line-height: 1.4; }
.sec-title { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 6px 4px -4px; color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 10px; }
.row-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 10px 12px 12px; border-radius: 20px; background: var(--card); text-align: left; box-shadow: 0 2px 0 var(--line); transition: transform .12s; }
.row-item:active { transform: scale(.98); }
.row-item .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--c); display: grid; place-items: center; flex: none; }
.row-item .ic svg { width: 28px; height: 28px; fill: #fff; color: #fff; }
.row-item .tx { flex: 1; min-width: 0; }
.row-item .tx b { display: block; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.15; color: var(--c); }
.row-item .tx span { font-size: 14px; color: var(--ink-soft); }
.row-item .chev { width: 18px; height: 18px; color: var(--ink-soft); flex: none; }
.mini-stars { display: flex; gap: 1px; margin-top: 3px; }
.star { width: 18px; height: 18px; }
.star path { fill: #E3ECF3; }
.star.on path { fill: var(--sun); stroke: #E9A400; stroke-width: 1; }
.featured { background: var(--card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 0 var(--line); }
.featured .lbl { font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .4px; text-transform: uppercase; }
.featured .t { display: flex; gap: 12px; align-items: center; }
.featured .t .ic { width: 56px; height: 56px; border-radius: 18px; background: var(--c); display: grid; place-items: center; flex: none; }
.featured .t .ic svg { width: 30px; height: 30px; fill: #fff; color: #fff; }
.featured .t b { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--c); line-height: 1.1; }
.btn { position: relative; overflow: hidden; min-height: 56px; border-radius: 18px; background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; font-size: 21px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; width: 100%; transition: transform .12s; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.btn:active { transform: translateY(2px) scale(.99); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn svg { width: 22px; height: 22px; }
.btn.tonal { background: var(--card); color: var(--c); box-shadow: inset 0 0 0 2.5px var(--c); }
.btn.tonal:active { box-shadow: inset 0 0 0 2.5px var(--c); }
.btn.danger { background: var(--coral); }

/* ---- repaso: carrusel ---- */
.carousel { position: relative; overflow: hidden; margin: 0 -16px; padding: 0 16px; touch-action: pan-y; cursor: grab; }
.carousel.drag { cursor: grabbing; }
.track { display: flex; gap: 12px; will-change: transform; }
.slide { flex: 0 0 calc(100% - 28px); background: var(--card); border-radius: 24px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; user-select: none; -webkit-user-select: none; box-shadow: 0 2px 0 var(--line); min-height: 380px; }
.slide img { pointer-events: none; -webkit-user-drag: none; }
.slide h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; color: var(--c); display: flex; align-items: center; gap: 10px; }
.slide h3 .ic { width: 42px; height: 42px; border-radius: 14px; background: var(--c); display: grid; place-items: center; flex: none; }
.slide h3 .ic svg { width: 22px; height: 22px; fill: #fff; color: #fff; }
.feat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.feat div { background: var(--sky); border-radius: 14px; padding: 8px 10px; font-size: 14px; line-height: 1.3; }
.feat b { display: block; font-size: 16px; color: var(--ink); }
.states { display: flex; flex-direction: column; gap: 8px; }
.states div { display: flex; align-items: center; gap: 12px; background: var(--sky); border-radius: 14px; padding: 6px 10px; }
.states img { width: 72px; height: 60px; object-fit: contain; background: #fff; border-radius: 10px; flex: none; }
.states b { display: block; font-family: var(--display); font-size: 19px; line-height: 1.1; }
.states span { font-size: 14px; color: var(--ink-soft); }
.tips { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.tips li { display: flex; gap: 10px; align-items: center; font-size: 15.5px; line-height: 1.35; background: var(--sky); border-radius: 14px; padding: 9px 10px; }
.tips li svg { width: 24px; height: 24px; flex: none; }
.big-num { font-family: var(--display); font-weight: 800; font-size: 80px; line-height: .9; color: var(--c); text-align: center; }
.cnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width .2s, background-color .2s; }
.dots i.on { width: 22px; background: var(--c); }
.hint { text-align: center; font-size: 13.5px; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
.hint svg { width: 18px; height: 18px; }

/* ---- logros ---- */
.ring-card { background: var(--card); border-radius: 24px; padding: 18px; display: flex; gap: 18px; align-items: center; box-shadow: 0 2px 0 var(--line); }
.ring { width: 104px; height: 104px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; line-height: 1; }
.ring .n small { display: block; font-size: 13px; color: var(--ink-soft); font-family: var(--body); font-weight: 700; }
.ring-card b { font-family: var(--display); font-size: 21px; line-height: 1.15; display: block; }
.ring-card p { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-soft); line-height: 1.4; }
.medal { background: linear-gradient(135deg, #FFE7A8, #FFC23C); border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: center; }
.medal svg { width: 52px; height: 52px; flex: none; }
.medal b { font-family: var(--display); font-size: 21px; line-height: 1.1; display: block; color: #6B4600; }
.medal span { font-size: 14px; color: #6B4600; }
.medal.locked { background: var(--card); box-shadow: 0 2px 0 var(--line); }
.medal.locked svg { opacity: .3; filter: grayscale(1); }
.medal.locked b, .medal.locked span { color: var(--ink-soft); }

/* ---- pantalla de juego (vista apilada) ---- */
.play { position: absolute; inset: 0; z-index: 5; background: var(--sky); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.play.open { transform: none; visibility: visible; }
.play .appbar { background: var(--sky); }
.play .appbar h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--c); line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counter { font-family: var(--display); font-weight: 800; font-size: 17px; padding: 0 8px; color: var(--ink-soft); flex: none; }
.pbar { height: 8px; margin: 0 16px 6px; background: var(--card); border-radius: 4px; overflow: hidden; flex: none; }
.pbar i { display: block; height: 100%; background: var(--c); border-radius: 4px; transition: width .35s ease; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.pfoot { flex: none; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--sky); }
.qcard { background: var(--card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 0 var(--line); }
.qhead { display: flex; gap: 6px; align-items: flex-start; }
.qtext { flex: 1; font-size: 22px; line-height: 1.4; font-weight: 700; min-width: 0; }
.blank { display: inline-block; min-width: 4.2em; border-bottom: 4px dashed var(--c); text-align: center; color: var(--c); padding: 0 4px; }
.blank.filled { border-bottom-style: solid; }
.qimg { display: flex; justify-content: center; }
.qimg img { max-height: 190px; max-width: 100%; border-radius: 16px; border: 2px solid var(--line); background: #fff; object-fit: contain; }
.qicon { width: 104px; height: 104px; border-radius: 50%; background: var(--c); display: grid; place-items: center; margin: 2px auto; }
.qicon svg { width: 56px; height: 56px; fill: #fff; color: #fff; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.two { flex-direction: row; } .opts.two .opt { flex: 1; }
.opt { position: relative; overflow: hidden; min-height: 60px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 2.5px var(--line), 0 3px 0 var(--line); font-size: 21px; font-weight: 700; padding: 8px 14px; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; transition: transform .1s; }
.opt:active:not(:disabled) { transform: scale(.97); }
.opt svg { width: 26px; height: 26px; flex: none; }
.opt.ok { background: var(--ok-bg); box-shadow: inset 0 0 0 3px var(--leaf); color: #126B39; }
.opt.bad { background: var(--bad-bg); box-shadow: inset 0 0 0 3px var(--coral); color: #A32B28; animation: shake .35s; }
.opt.dim { opacity: .45; }
.opt:disabled { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.glasses { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.gl { position: relative; overflow: hidden; min-height: 64px; border-radius: 14px; display: grid; place-items: center; padding: 4px; transition: transform .1s; }
.gl:active { transform: scale(.92); }
.gl svg { width: 100%; max-width: 52px; height: auto; aspect-ratio: 3 / 4; }
.gl .water { fill: transparent; transition: fill .15s; }
.gl.on .water { fill: #5CC8F0; }
.count { text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--c); }

/* resultado */
.result { align-items: center; text-align: center; padding: 24px 16px; }
.result .bigstars { display: flex; gap: 8px; justify-content: center; }
.result .bigstars .star { width: 70px; height: 70px; }
.result .bigstars .star.on { animation: pop .45s backwards; }
.result .bigstars .star:nth-child(2) { animation-delay: .15s; } .result .bigstars .star:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1); } }
.result h3 { margin: 4px 0 0; font-family: var(--display); font-size: 34px; color: var(--c); line-height: 1.1; }
.result p { margin: 0; font-size: 19px; }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* ---- hoja inferior ---- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; transition: opacity .25s; pointer-events: none; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 28px 28px 0 0; max-height: 88%; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -8px 30px rgba(7,32,56,.18); }
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.grab { flex: none; height: 32px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab i { width: 40px; height: 5px; border-radius: 3px; background: #C3D3E0; }
.sheet .sh-head { padding: 0 20px 4px; touch-action: none; }
.sheet .sh-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.15; }
.sheet .sh-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet.fb-ok { background: #F1FCF5; } .sheet.fb-bad { background: #FFF5F4; }
.fbhead { display: flex; gap: 12px; align-items: center; }
.fbhead svg { width: 44px; height: 44px; flex: none; }
.fbhead b { font-family: var(--display); font-size: 28px; line-height: 1; }
.fb-ok .fbhead b { color: #126B39; } .fb-bad .fbhead b { color: #A32B28; }
.fbtext { font-size: 18px; line-height: 1.45; margin: 0; }
.setrow { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.setrow .ic2 { width: 40px; height: 40px; border-radius: 12px; background: var(--sky); display: grid; place-items: center; flex: none; }
.setrow .ic2 svg { width: 20px; height: 20px; }
.setrow .lb { flex: 1; min-width: 0; }
.setrow .lb b { display: block; font-size: 17px; }
.setrow .lb span { font-size: 13.5px; color: var(--ink-soft); }
.switch { width: 60px; height: 48px; display: grid; place-items: center; flex: none; }
.switch .tr { width: 52px; height: 32px; border-radius: 16px; background: #C3D3E0; position: relative; transition: background-color .2s; }
.switch .tr::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] .tr { background: var(--leaf); }
.switch[aria-checked="true"] .tr::after { transform: translateX(20px); }
.switch:active .tr::after { width: 28px; }

.burst { position: absolute; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; z-index: 30; animation: fly .8s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="phone" id="phone">
  <header class="appbar">
    <h1 id="ttl"></h1>
    <span class="chip-stars" id="chipStars" aria-label="Estrellas ganadas"></span>
    <button class="ibtn rp" id="btnAjustes" aria-label="Ajustes"></button>
  </header>

  <main class="views">
    <section class="view" id="v-misiones" aria-label="Misiones"></section>
    <section class="view" id="v-repaso" aria-label="Repaso" aria-hidden="true"></section>
    <section class="view" id="v-logros" aria-label="Logros" aria-hidden="true"></section>
  </main>

  <nav class="bnav" role="tablist" aria-label="Navegación principal" id="bnav"></nav>

  <section class="play" id="play" aria-label="Misión en curso">
    <header class="appbar">
      <button class="ibtn rp" id="pClose" aria-label="Salir de la misión"></button>
      <h2 id="pTitle"></h2>
      <span class="counter" id="pCount"></span>
      <button class="ibtn rp" id="pSay" aria-label="Escuchar la pregunta"></button>
    </header>
    <div class="pbar" aria-hidden="true"><i id="pBar"></i></div>
    <div class="pbody" id="pBody"></div>
    <div class="pfoot" id="pFoot" hidden></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grab" id="grab"><i></i></div>
    <div class="sh-head" id="shHead"><h3 id="shTitle"></h3></div>
    <div class="sh-body" id="shBody"></div>
  </section>

phone.addEventListener('pointerdown', (e) => {

/* ---------- sonido, vibración y voz ---------- */
let actx = null;
function tone(ok) {
  if (!prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (ok ? [660, 880, 1175] : [300, 220]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.11;
      o.type = ok ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}
const buzz = (p) => { if (prefs.vibe && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } };
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak || !prefs.voice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/___/g, 'espacio en blanco'));
    u.lang = 'es-CL'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function burst(el, color) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), p = phone.getBoundingClientRect();
  const cols = [color, '#FFC23C', '#5CC8F0', '#1E9B53'];
  for (let k = 0; k < 14; k++) {
    const d = document.createElement('i'); d.className = 'burst';
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
    d.style.left = (r.left - p.left + r.width / 2) + 'px'; d.style.top = (r.top - p.top + r.height / 2) + 'px';
    d.style.background = cols[k % cols.length];
    d.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); d.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    phone.appendChild(d); setTimeout(() => d.remove(), 900);
  }
}

const sheet = $('sheet'), scrim = $('scrim');
let sheetState = null; // {dismissible, onClose}
function openSheet({ title = '', html, cls = '', dismissible = true, onClose = null }) {
  sheet.className = 'sheet ' + cls;
  $('shTitle').textContent = title; $('shHead').hidden = !title;
  $('grab').hidden = !dismissible;
  $('shBody').innerHTML = html;
  sheetState = { dismissible, onClose };
  sheet.style.transform = '';
  requestAnimationFrame(() => { scrim.classList.add('open'); sheet.classList.add('open'); });
  setTimeout(() => { const f = sheet.querySelector('[data-autofocus]'); if (f) f.focus({ preventScroll: true }); }, 320);
}
function closeSheet(run = true) {
  if (!sheetState) return;
  const cb = sheetState.onClose; sheetState = null;
  sheet.classList.remove('open', 'dragging'); sheet.style.transform = ''; scrim.classList.remove('open');
  if (run && cb) cb();
}
scrim.addEventListener('click', () => { if (sheetState && sheetState.dismissible) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetState && sheetState.dismissible) closeSheet(); });
(function dragSheet() {
  let y0 = 0, t0 = 0, dy = 0, lastY = 0, lastT = 0, vel = 0, on = false;
  const start = (e) => {
    if (!sheetState || !sheetState.dismissible) return;
    on = true; y0 = lastY = e.clientY; t0 = lastT = performance.now(); dy = 0; vel = 0;
    sheet.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId);
  };
  const move = (e) => {
    if (!on) return;
    dy = Math.max(0, e.clientY - y0);
    const now = performance.now(); vel = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now;
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / sheet.offsetHeight));
  };
  const end = () => {
    if (!on) return; on = false;
    sheet.classList.remove('dragging'); scrim.style.opacity = '';
    if (dy > sheet.offsetHeight * 0.3 || vel > 0.6) closeSheet();
    else sheet.style.transform = '';
  };
  ['grab', 'shHead'].forEach((id) => {
    const el = $(id);
    el.addEventListener('pointerdown', start); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  });
})();

function setupCarousel() {
  const car = $('car'), track = $('track');
  const step = () => { const s = track.children[0]; return s.getBoundingClientRect().width + 12; };
  const setPos = (x, anim) => { track.style.transition = anim ? 'transform .32s cubic-bezier(.2,.8,.2,1)' : 'none'; track.style.transform = `translateX(${x}px)`; };
  const go = (i) => {
    cIdx = Math.max(0, Math.min(SLIDES.length - 1, i)); setPos(-cIdx * step(), true);
    $('dots').querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === cIdx));
    $('cPrev').disabled = cIdx === 0; $('cNext').disabled = cIdx === SLIDES.length - 1;
    $('cPrev').style.opacity = cIdx === 0 ? .35 : 1; $('cNext').style.opacity = cIdx === SLIDES.length - 1 ? .35 : 1;
  };
  $('cPrev').onclick = () => go(cIdx - 1); $('cNext').onclick = () => go(cIdx + 1);
  let x0 = 0, y0 = 0, dx = 0, lastX = 0, lastT = 0, vel = 0, on = false, axis = null;
  car.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    on = true; axis = null; x0 = lastX = e.clientX; y0 = e.clientY; lastT = performance.now(); dx = 0; vel = 0;
  });
  car.addEventListener('pointermove', (e) => {
    if (!on) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!axis) { if (Math.abs(mx) < 6 && Math.abs(my) < 6) return; axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if (axis === 'x') { car.setPointerCapture(e.pointerId); car.classList.add('drag'); } }
    if (axis !== 'x') return;
    e.preventDefault();
    dx = mx; const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    let x = -cIdx * step() + dx;
    if ((cIdx === 0 && dx > 0) || (cIdx === SLIDES.length - 1 && dx < 0)) x = -cIdx * step() + dx * 0.35;
    setPos(x, false);
  });
  const end = () => {
    if (!on) return; on = false; car.classList.remove('drag');
    if (axis !== 'x') return;
    const w = step();
    if (dx < -w * 0.2 || vel < -0.45) go(cIdx + 1); else if (dx > w * 0.2 || vel > 0.45) go(cIdx - 1); else go(cIdx);
  };
  car.addEventListener('pointerup', end); car.addEventListener('pointercancel', end);
  car.addEventListener('dragstart', (e) => e.preventDefault());
  window.addEventListener('resize', () => go(cIdx));
  go(cIdx);
}

    body = `<div class="opts${it.opts.length === 2 ? ' two' : ''}">${it.opts.map((o, k) => {
      let cls = '';
      if (play.answered) cls = k === it.a ? 'ok' : k === play.answered.pick ? 'bad' : 'dim';
      return `<button class="opt ${cls}" data-k="${k}" ${play.answered ? 'disabled' : ''}>${cls === 'ok' ? IC.okc : cls === 'bad' ? IC.xc : ''}${o}</button>`;
    }).join('')}</div>`;
  }
  $('pBody').innerHTML = `<section class="qcard"><div class="qtext">${q}</div>${media}</section>${body}`;
  if (L.glasses) {
    $('pBody').querySelectorAll('.gl').forEach((g) => g.onclick = () => { const k = +g.dataset.k; play.filled = play.filled === k + 1 ? k : k + 1; buzz(10); renderQ(); });
    const c = $('check'); if (c) c.onclick = () => answer(play.filled === 8, null, c);
  } else {
    $('pBody').querySelectorAll('.opt').forEach((b) => b.onclick = () => answer(+b.dataset.k === it.a, +b.dataset.k, b));
  }
}
function answer(ok, k, el) {
  if (!play || play.answered) return;
  const L = LEVELS[play.lv], it = play.order[play.i];
  if (ok) { play.right++; burst(el, L.c); }
  tone(ok); buzz(ok ? 25 : [40, 60, 40]);
  play.answered = { ok, pick: k };
  renderQ();
  const last = play.i + 1 >= play.order.length;
  openSheet({ cls: ok ? 'fb-ok' : 'fb-bad', dismissible: false, html: `
    <div class="fbhead">${ok ? IC.smile : IC.think}<b>${ok ? pick(['¡Muy bien!', '¡Excelente!', '¡Correcto!', '¡Bien hecho!']) : '¡Casi!'}</b></div>
    <p class="fbtext">${!ok && L.glasses ? 'Son 8 vasos. ' : ''}${it.why}</p>
    <button class="btn" style="--c:${L.c}" id="nextQ" data-autofocus>${last ? 'Ver mis estrellas' : 'Siguiente'} ${IC.arrow}</button>` });
  $('nextQ').onclick = () => { closeSheet(false); play.i++; play.answered = null; play.filled = 0; $('pBody').scrollTop = 0; renderQ(); };
}
function finish() {
  const L = LEVELS[play.lv], n = play.order.length, r = play.right;
  const s = r === n ? 3 : r / n >= 0.6 ? 2 : r > 0 ? 1 : 0;
  stars[L.id] = Math.max(stars[L.id] || 0, s); store.set('misionAguaStars', stars);
  $('pBar').style.width = '100%'; $('pCount').textContent = ''; $('pSay').hidden = true;
  const nx = play.lv + 1 < LEVELS.length ? play.lv + 1 : null;
  $('pFoot').hidden = true;
  $('pBody').innerHTML = `<section class="qcard result">
      ${STARS(s, 'bigstars')}
      <h3>${s === 3 ? '¡Perfecto!' : s === 2 ? '¡Muy bien!' : '¡Sigue practicando!'}</h3>
      <p>Respondiste bien <b>${r} de ${n}</b>.</p>
      <div class="stack">
        ${nx !== null ? `<button class="btn" style="--c:${LEVELS[nx].c}" id="rNext">Siguiente misión ${IC.arrow}</button>` : ''}
        <button class="btn tonal" id="rAgain">${IC.redo} Jugar otra vez</button>
        <button class="btn tonal" style="--c:#0B3B66" id="rHome">Volver a las misiones</button>
      </div></section>`;
  if (s >= 2) { tone(true); buzz([30, 50, 30]); }
  refreshChromeOnly();
  const lv = play.lv;
  if (nx !== null) $('rNext').onclick = () => startLevel(nx);
  $('rAgain').onclick = () => startLevel(lv);
  $('rHome').onclick = () => { goTab('misiones'); closePlay(); };
}

function refreshChromeOnly() { $('chipStars').innerHTML = STAR(true) + total(); }
function refreshAll() { refreshChromeOnly(); renderMisiones(); renderLogros(); }

renderChrome(); renderMisiones(); renderRepaso(); renderLogros(); goTab('misiones');
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
</script>
